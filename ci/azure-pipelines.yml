trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

# Public contributions must never execute on the private Default pool.
pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
  - script: npm ci
    displayName: Install server and CLI dependencies
  - script: npm --prefix dashboard ci
    displayName: Install dashboard dependencies
  - script: npm test -- --runInBand --watchman=false --testTimeout=30000
    displayName: Test server and CLI
  - script: npm --prefix dashboard test -- --runInBand --watchman=false
    displayName: Test dashboard
  - script: npm run build -- --webpack
    displayName: Build Community and verify runtime assets
  - script: node ci/smoke.cjs
    displayName: Verify compiled Community startup
  - script: node --test ci/native/package.test.cjs
    displayName: Test native packaging boundaries
  - script: node ci/notices.cjs
    displayName: Collect release-platform dependency notices
  - script: node ci/native/package.cjs "$(Build.ArtifactStagingDirectory)/native" "0.0.0-ci.$(Build.BuildId)"
    displayName: Package native Community candidate
  - script: node ci/native/smoke.cjs "$(Build.ArtifactStagingDirectory)/native/deviceyard-community-0.0.0-ci.$(Build.BuildId)-linux-x64.tar.gz.json"
    displayName: Verify extracted native Community archive
  - task: PublishPipelineArtifact@1
    displayName: Retain private native candidate (no release promotion)
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/native'
      artifact: native-community-linux-x64
  - script: docker build --platform linux/amd64 --build-arg SOURCE_REVISION=$(Build.SourceVersion) -f ci/container/Dockerfile -t deviceyard-community:test .
    displayName: Build Community container (no publication)
  - script: node ci/container/smoke.cjs deviceyard-community:test
    displayName: Verify container lifecycle and persistence
